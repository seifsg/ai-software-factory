<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="eyebrow">A SMALL, CLEAR LIST</p>
    <h1>Make room for<br>what matters.</h1>
    <p class="intro">One task at a time. Your notes stay in this browser.</p>
    <form id="task-form" novalidate>
      <label for="title">What needs doing?</label>
      <div class="entry"><input id="title" name="title" autocomplete="off"><button type="submit">Add task</button></div>
      <p id="feedback" role="status" aria-live="polite"></p>
    </form>
    <ul id="tasks" aria-label="Your tasks"></ul>
    <p id="empty">A clear slate. Add your first task above.</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
