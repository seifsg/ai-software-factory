<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
<title id="t">AI Software Factory run</title>
<desc id="d">One request goes through ten steps: ticket, analyze, recommend, challenge, plan, Before proof, build, verify, PR and review. Fresh checker gates A, B and C sit after plan, verify and review. The run ends in a reviewed draft PR.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#c9d1d9}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.n{font-size:17px;font-weight:700;fill:#fff;text-anchor:middle}
.l{font-size:16px;text-anchor:middle;fill:#8b949e}
.g{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle}
.st{fill:#1f2937;stroke:#6E56CF;stroke-width:2;animation:lit 8s infinite both}
.gt{fill:#1f2937;stroke:#2EA44F;stroke-width:2;animation:pass 8s infinite both}
.pr{fill:#1f2937;stroke:#2EA44F;stroke-width:2;animation:pass 8s infinite both;animation-delay:5.4s}
.track{stroke:#30363d;stroke-width:4}
.flow{stroke:#6E56CF;stroke-width:4;stroke-dasharray:1000;stroke-dashoffset:1000;animation:run 8s linear infinite}
@keyframes lit{0%,4%{fill:#1f2937}8%,88%{fill:#6E56CF}100%{fill:#1f2937}}
@keyframes pass{0%,4%{fill:#1f2937}8%,88%{fill:#2EA44F}100%{fill:#1f2937}}
@keyframes run{0%{stroke-dashoffset:1000}70%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:1000}}
@media (prefers-reduced-motion:reduce){.st,.gt,.pr,.flow{animation:none}.st{fill:#6E56CF}.gt,.pr{fill:#2EA44F}.flow{stroke-dashoffset:0}}
</style>
<rect width="1200" height="330" rx="20" fill="#0d1117"/>
<rect x="1" y="1" width="1198" height="328" rx="19" fill="none" stroke="#30363d" stroke-width="2"/>
<circle cx="36" cy="34" r="7" fill="#ff5f57"/><circle cx="58" cy="34" r="7" fill="#febc2e"/><circle cx="80" cy="34" r="7" fill="#28c840"/>
<text x="110" y="40" class="mono" font-size="18"><tspan fill="#6E56CF">/safe-engine</tspan> Build &lt;your app or feature&gt;. Success means &lt;outcome&gt;.</text>
<line x1="70" y1="150" x2="1070" y2="150" class="track"/>
<line x1="70" y1="150" x2="1070" y2="150" class="flow"/>
<g>
<circle cx="70" cy="150" r="26" class="st" style="animation-delay:0s"/><text x="70" y="156" class="n">0</text><text x="70" y="208" class="l">Ticket</text>
<circle cx="160" cy="150" r="26" class="st" style="animation-delay:.45s"/><text x="160" y="156" class="n">1</text><text x="160" y="208" class="l">Analyze</text>
<circle cx="250" cy="150" r="26" class="st" style="animation-delay:.9s"/><text x="250" y="156" class="n">2</text><text x="250" y="208" class="l">Recommend</text>
<circle cx="340" cy="150" r="26" class="st" style="animation-delay:1.35s"/><text x="340" y="156" class="n">2b</text><text x="340" y="208" class="l">Challenge</text>
<circle cx="430" cy="150" r="26" class="st" style="animation-delay:1.8s"/><text x="430" y="156" class="n">3</text><text x="430" y="208" class="l">Plan</text>
<rect x="476" y="136" width="28" height="28" rx="4" transform="rotate(45 490 150)" class="gt" style="animation-delay:2.25s"/><text x="490" y="155" class="g">A</text>
<circle cx="550" cy="150" r="26" class="st" style="animation-delay:2.7s"/><text x="550" y="156" class="n">4</text><text x="550" y="208" class="l">Before</text>
<circle cx="640" cy="150" r="26" class="st" style="animation-delay:3.15s"/><text x="640" y="156" class="n">5</text><text x="640" y="208" class="l">Build</text>
<circle cx="730" cy="150" r="26" class="st" style="animation-delay:3.6s"/><text x="730" y="156" class="n">6</text><text x="730" y="208" class="l">Verify</text>
<rect x="776" y="136" width="28" height="28" rx="4" transform="rotate(45 790 150)" class="gt" style="animation-delay:4.05s"/><text x="790" y="155" class="g">B</text>
<circle cx="850" cy="150" r="26" class="st" style="animation-delay:4.5s"/><text x="850" y="156" class="n">7</text><text x="850" y="208" class="l">PR</text>
<circle cx="940" cy="150" r="26" class="st" style="animation-delay:4.95s"/><text x="940" y="156" class="n">8</text><text x="940" y="208" class="l">Review</text>
<rect x="996" y="136" width="28" height="28" rx="4" transform="rotate(45 1010 150)" class="gt" style="animation-delay:5.2s"/><text x="1010" y="155" class="g">C</text>
<rect x="1050" y="120" width="120" height="60" rx="12" class="pr"/>
<text x="1110" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Draft PR</text>
<text x="1110" y="166" text-anchor="middle" font-size="13" fill="#fff">reviewed ✓</text>
</g>
<text x="70" y="262" font-size="18"><tspan fill="#6E56CF">●</tspan> each step loads its skill fresh and prints its block</text>
<text x="70" y="292" font-size="18"><tspan fill="#2EA44F">◆</tspan> gates A, B, C: a fresh checker, proven on the commit</text>
<text x="640" y="262" font-size="18"><tspan fill="#febc2e">■</tspan> Before/After proof captured, not described</text>
<text x="640" y="292" font-size="18"><tspan fill="#8b949e">■</tspan> Stop guard keeps the run going until all ten are done</text>
</svg>
