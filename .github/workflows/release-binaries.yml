# Release branch: build the six factory binaries (factory.yml) and commit them with their checksums to the branch.
# The bundle commit only touches .agents/scripts, which this workflow ignores, so it never triggers itself.
name: release-binaries

on:
  push:
    branches: ['release/v*']
    paths-ignore: ['.agents/scripts/**']

permissions:
  contents: read

# A newer push to the branch supersedes the bundle of an older one.
concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  factory:
    uses: ./.github/workflows/factory.yml

  bundle:
    needs: factory
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # build provenance: a signed record of the workflow run that built each binary
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }} # the commit the binaries were built from; the push fails if the branch moved
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: factory-*
          path: .agents/scripts
          merge-multiple: true
      # Anyone can check a bundled binary came from this workflow: gh attestation verify <file> -R <this repo>.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: .agents/scripts/factory-*
      - name: Commit the binaries and SHA256SUMS
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          v=$(grep -o '"version": "[^"]*"' .agents/.claude-plugin/plugin.json | cut -d'"' -f4)
          cd .agents/scripts
          export LC_ALL=C # sorted by file name
          set -- factory-*-*
          [ "$#" -eq 6 ] && [ -f "$1" ] || { echo "::error::expected 6 binaries, got: $*"; exit 1; }
          sha256sum "$@" > SHA256SUMS
          # The factory/ tree the binaries were built from: publish refuses a bundle from other source.
          git rev-parse "${GITHUB_SHA}:factory" > SOURCE
          git add "$@" SHA256SUMS SOURCE
          git update-index --chmod=+x factory-*-apple-darwin factory-*-linux-musl
          if git diff --cached --quiet; then echo "binaries and SHA256SUMS unchanged"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore(release): bundle factory binaries $v"
          git push -q origin "HEAD:refs/heads/$BRANCH"
