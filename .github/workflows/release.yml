# Publishes a GitHub release for a pushed v* tag, only after the release check (docs/releasing.md).
# Humans push tags; this workflow never pushes, moves or deletes one, and a version is never re-published.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest  # the platform the suite runs on today; three-OS CI is its own ticket
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # the check needs origin/main to prove the tag is on main
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
      - name: Check the tag (equals the version, on main, changelog section, files match the manifest)
        run: python scripts/release.py check "$GITHUB_REF_NAME" --out dist
      - name: Tests
        run: python tests/run.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME"
          --notes-file dist/notes.md dist/release-manifest.json dist/SHA256SUMS
