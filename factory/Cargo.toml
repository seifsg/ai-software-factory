[package]
name = "factory"
version = "0.8.9"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "AI Software Factory: the run guard and the free checks as one native binary"
repository = "https://github.com/seifsg/ai-software-factory"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "factory"
path = "src/main.rs"

[dependencies]
serde_json = "1"
memchr = "2"
miniz_oxide = "0.8"
sha1_smol = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
